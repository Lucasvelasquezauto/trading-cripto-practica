# TEMPORAL (16 nov 2026): repite días sintéticos sin red sobre una copia y muestra las huellas de los archivos que
# produce, para comparar con lo que produce el mismo código en el PC. No guarda nada. Se borra después de la prueba.
name: Prueba de igualdad (temporal)
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  prueba:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Repetir días sintéticos
        env:
          PYTHONIOENCODING: utf-8
        run: |
          python --version
          mkdir /tmp/copia && git archive HEAD | tar -x -C /tmp/copia
          python .github/prueba/prueba_sintetica.py /tmp/copia | tail -5
          cd /tmp/copia && sha256sum datos/paper/* reportes/diario/* informe.html datos/*.csv
